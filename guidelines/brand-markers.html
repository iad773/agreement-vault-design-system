<!-- @dsCard group="Brand" viewport="700x200" subtitle="Circles are time. Squares are findings. Never interchangeable." name="Marker families" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 18px 20px; background: var(--surface-card); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .sw { width: 78px; }
  .chip { height: 46px; border-radius: var(--radius-md); border: 1px solid var(--border-hairline); }
  .nm { font: var(--type-label-caps); color: var(--text-strong); margin-top: 6px; display: block; }
  .hx { font: var(--weight-regular) 10.5px var(--font-mono); color: var(--text-muted); display: block; }
</style>
</head>
<body>
<div style="display:grid;gap:9px;font:var(--type-base, var(--weight-regular) 13px var(--font-sans));color:var(--text-strong)">
  <div style="display:flex;align-items:center;gap:10px"><span style="width:12px;height:12px;border-radius:50%;background:var(--danger);flex:none"></span><span><b>Filled circle, red</b> <span style="color:var(--text-muted)">- a dated deadline that has arrived or passed</span></span></div>
  <div style="display:flex;align-items:center;gap:10px"><span style="width:12px;height:12px;border-radius:50%;border:2.5px solid var(--warning);box-sizing:border-box;flex:none"></span><span><b>Open circle, amber</b> <span style="color:var(--text-muted)">- a dated deadline coming up soon</span></span></div>
  <div style="display:flex;align-items:center;gap:10px"><span style="width:11px;height:11px;background:var(--steel-900);flex:none"></span><span><b>Filled square, ink</b> <span style="color:var(--text-muted)">- a finding: this is wrong right now</span></span></div>
  <div style="display:flex;align-items:center;gap:10px"><span style="width:11px;height:11px;border:2.5px solid var(--warning);box-sizing:border-box;flex:none"></span><span><b>Open square, amber</b> <span style="color:var(--text-muted)">- a finding: check this</span></span></div>
</div>
</body>
</html>
