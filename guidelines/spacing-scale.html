<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Real values off the boards. Not snapped to a 4px grid." name="Spacing scale" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 18px 20px; background: var(--surface-card); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .sw { width: 78px; }
  .chip { height: 46px; border-radius: var(--radius-md); border: 1px solid var(--border-hairline); }
  .nm { font: var(--type-label-caps); color: var(--text-strong); margin-top: 6px; display: block; }
  .hx { font: var(--weight-regular) 10.5px var(--font-mono); color: var(--text-muted); display: block; }
</style>
</head>
<body>
<div style="display:flex;align-items:flex-end;gap:8px">
  <div style="text-align:center"><div style="width:22px;height:3px;background:var(--vault-steel)"></div><div style="font:var(--weight-regular) 10px var(--font-mono);color:var(--text-muted);margin-top:5px">3px</div></div>
  <div style="text-align:center"><div style="width:22px;height:6px;background:var(--vault-steel)"></div><div style="font:var(--weight-regular) 10px var(--font-mono);color:var(--text-muted);margin-top:5px">6px</div></div>
  <div style="text-align:center"><div style="width:22px;height:8px;background:var(--vault-steel)"></div><div style="font:var(--weight-regular) 10px var(--font-mono);color:var(--text-muted);margin-top:5px">8px</div></div>
  <div style="text-align:center"><div style="width:22px;height:10px;background:var(--vault-steel)"></div><div style="font:var(--weight-regular) 10px var(--font-mono);color:var(--text-muted);margin-top:5px">10px</div></div>
  <div style="text-align:center"><div style="width:22px;height:12px;background:var(--vault-steel)"></div><div style="font:var(--weight-regular) 10px var(--font-mono);color:var(--text-muted);margin-top:5px">12px</div></div>
  <div style="text-align:center"><div style="width:22px;height:14px;background:var(--vault-steel)"></div><div style="font:var(--weight-regular) 10px var(--font-mono);color:var(--text-muted);margin-top:5px">14px</div></div>
  <div style="text-align:center"><div style="width:22px;height:16px;background:var(--vault-steel)"></div><div style="font:var(--weight-regular) 10px var(--font-mono);color:var(--text-muted);margin-top:5px">16px</div></div>
  <div style="text-align:center"><div style="width:22px;height:18px;background:var(--vault-steel)"></div><div style="font:var(--weight-regular) 10px var(--font-mono);color:var(--text-muted);margin-top:5px">18px</div></div>
  <div style="text-align:center"><div style="width:22px;height:20px;background:var(--vault-steel)"></div><div style="font:var(--weight-regular) 10px var(--font-mono);color:var(--text-muted);margin-top:5px">20px</div></div>
  <div style="text-align:center"><div style="width:22px;height:22px;background:var(--vault-steel)"></div><div style="font:var(--weight-regular) 10px var(--font-mono);color:var(--text-muted);margin-top:5px">22px</div></div>
  <div style="text-align:center"><div style="width:22px;height:24px;background:var(--vault-steel)"></div><div style="font:var(--weight-regular) 10px var(--font-mono);color:var(--text-muted);margin-top:5px">24px</div></div>
  <div style="text-align:center"><div style="width:22px;height:28px;background:var(--vault-steel)"></div><div style="font:var(--weight-regular) 10px var(--font-mono);color:var(--text-muted);margin-top:5px">28px</div></div>
  <div style="text-align:center"><div style="width:22px;height:32px;background:var(--vault-steel)"></div><div style="font:var(--weight-regular) 10px var(--font-mono);color:var(--text-muted);margin-top:5px">32px</div></div>
  <div style="text-align:center"><div style="width:22px;height:44px;background:var(--vault-steel)"></div><div style="font:var(--weight-regular) 10px var(--font-mono);color:var(--text-muted);margin-top:5px">44px</div></div>
</div>
</body>
</html>
