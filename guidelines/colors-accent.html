<!-- @dsCard group="Colors" viewport="700x150" subtitle="One accent. Primary actions, selection, header rules, links." name="Accent: vault steel" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 18px 20px; background: var(--surface-card); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .sw { width: 78px; }
  .chip { height: 46px; border-radius: var(--radius-md); border: 1px solid var(--border-hairline); }
  .nm { font: var(--type-label-caps); color: var(--text-strong); margin-top: 6px; display: block; }
  .hx { font: var(--weight-regular) 10.5px var(--font-mono); color: var(--text-muted); display: block; }
</style>
</head>
<body>
<div class="row">
      <div class="sw"><div class="chip" style="background:var(--vault-steel);"></div><span class="nm">Steel</span><span class="hx">--vault-steel</span></div>
      <div class="sw"><div class="chip" style="background:var(--vault-steel-hover);"></div><span class="nm">Steel hover</span><span class="hx">--vault-steel-hover</span></div>
      <div class="sw"><div class="chip" style="background:var(--vault-steel-tint);"></div><span class="nm">Steel tint</span><span class="hx">--vault-steel-tint</span></div>
      <div class="sw"><div class="chip" style="background:var(--vault-steel-tint-border);"></div><span class="nm">Tint border</span><span class="hx">--vault-steel-tint-border</span></div>
</div>
</body>
</html>
