<!-- @dsCard group="Colors" viewport="700x150" subtitle="Ground, plate, lines, and ink. The whole product lives here." name="Cool steel neutrals" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 18px 20px; background: var(--surface-card); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .sw { width: 78px; }
  .chip { height: 46px; border-radius: var(--radius-md); border: 1px solid var(--border-hairline); }
  .nm { font: var(--type-label-caps); color: var(--text-strong); margin-top: 6px; display: block; }
  .hx { font: var(--weight-regular) 10.5px var(--font-mono); color: var(--text-muted); display: block; }
</style>
</head>
<body>
<div class="row">
      <div class="sw"><div class="chip" style="background:var(--steel-50);"></div><span class="nm">Ground</span><span class="hx">--steel-50</span></div>
      <div class="sw"><div class="chip" style="background:var(--steel-100);"></div><span class="nm">Plate</span><span class="hx">--steel-100</span></div>
      <div class="sw"><div class="chip" style="background:var(--steel-200);"></div><span class="nm">Line</span><span class="hx">--steel-200</span></div>
      <div class="sw"><div class="chip" style="background:var(--steel-300);"></div><span class="nm">Card line</span><span class="hx">--steel-300</span></div>
      <div class="sw"><div class="chip" style="background:var(--steel-600);"></div><span class="nm">Muted</span><span class="hx">--steel-600</span></div>
      <div class="sw"><div class="chip" style="background:var(--steel-700);"></div><span class="nm">Secondary</span><span class="hx">--steel-700</span></div>
      <div class="sw"><div class="chip" style="background:var(--steel-900);"></div><span class="nm">Ink</span><span class="hx">--steel-900</span></div>
</div>
</body>
</html>
