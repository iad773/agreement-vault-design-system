<!-- @dsCard group="Type" viewport="700x175" subtitle="Headings, card titles, and every large numeral." name="Bitter, slab headings" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 18px 20px; background: var(--surface-card); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .sw { width: 78px; }
  .chip { height: 46px; border-radius: var(--radius-md); border: 1px solid var(--border-hairline); }
  .nm { font: var(--type-label-caps); color: var(--text-strong); margin-top: 6px; display: block; }
  .hx { font: var(--weight-regular) 10.5px var(--font-mono); color: var(--text-muted); display: block; }
</style>
</head>
<body>
<div style="font:var(--weight-black) 30px var(--font-slab);color:var(--text-strong)">Under contract <span style="font-weight:400">Aa 0123456789</span></div>
<div style="font:var(--type-hero-number);color:var(--text-strong);margin-top:8px">$105,000</div>
<div style="font:var(--weight-regular) 12.5px var(--font-sans);color:var(--text-muted);margin-top:8px">800 for page headings and hero numbers, 700 for card titles. Never below 15px.</div>
</body>
</html>
