<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 18px 20px; background: var(--surface-card); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .sw { width: 78px; }
  .chip { height: 46px; border-radius: var(--radius-md); border: 1px solid var(--border-hairline); }
  .nm { font: var(--type-label-caps); color: var(--text-strong); margin-top: 6px; display: block; }
  .hx { font: var(--weight-regular) 10.5px var(--font-mono); color: var(--text-muted); display: block; }
</style>
</head>
<body>
<div style="border:1px solid var(--border-card-color)">
  <div style="background:var(--sandbox-band);border-bottom:1px solid var(--sandbox-band-border);padding:9px 20px;text-align:center;font:var(--weight-bold) 13.5px var(--font-sans);color:var(--text-strong)">Sample data. Nothing here is a real document.</div>
  <div style="display:flex;align-items:center;gap:10px;height:44px;padding:0 20px;background:var(--surface-inverse)">
    <span style="font:var(--weight-black) 14px var(--font-slab);color:var(--text-inverse)">Spacely Sprockets Franchising</span>
    <span style="font:var(--weight-bold) var(--text-2xs) var(--font-sans);letter-spacing:var(--tracking-caps);color:var(--warning);background:var(--warning-surface);border:1px solid var(--warning-border);padding:2px 7px;border-radius:var(--radius-md)">SANDBOX</span>
  </div>
</div>
</body>
</html>
