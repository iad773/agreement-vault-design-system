<!-- @dsCard group="Brand" viewport="700x150" subtitle="A 54px ink bar across the top of every screen. The one heavy horizontal." name="The lintel" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 18px 20px; background: var(--surface-card); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .sw { width: 78px; }
  .chip { height: 46px; border-radius: var(--radius-md); border: 1px solid var(--border-hairline); }
  .nm { font: var(--type-label-caps); color: var(--text-strong); margin-top: 6px; display: block; }
  .hx { font: var(--weight-regular) 10.5px var(--font-mono); color: var(--text-muted); display: block; }
</style>
</head>
<body>
<div style="border:1px solid var(--border-card-color)">
  <div style="display:flex;align-items:center;gap:12px;height:54px;padding:0 20px;background:var(--surface-inverse)">
    <div style="width:24px;height:24px;border-radius:50%;border:3.5px solid var(--on-dark);display:grid;place-items:center"><span style="width:7px;height:7px;background:var(--on-dark);display:block"></span></div>
    <span style="font:var(--weight-black) 15px var(--font-slab);color:var(--text-inverse)">Spacely Sprockets Franchising</span>
  </div>
  <div style="height:44px;background:var(--surface-app)"></div>
</div>
</body>
</html>
