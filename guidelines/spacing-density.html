<!-- @dsCard group="Spacing" viewport="700x205" subtitle="44px standard rows, full-width hairlines, tabular dates." name="Row density in use" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 18px 20px; background: var(--surface-card); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .sw { width: 78px; }
  .chip { height: 46px; border-radius: var(--radius-md); border: 1px solid var(--border-hairline); }
  .nm { font: var(--type-label-caps); color: var(--text-strong); margin-top: 6px; display: block; }
  .hx { font: var(--weight-regular) 10.5px var(--font-mono); color: var(--text-muted); display: block; }
</style>
</head>
<body>
<div style="border:var(--border-card);background:var(--surface-card)">
  <div style="display:grid;grid-template-columns:1fr 150px 110px;gap:10px;padding:8px 22px;border-bottom:var(--rule-card-header);font:var(--type-label-caps);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)"><span>Title</span><span>Type</span><span>Filed</span></div>
  <div style="display:grid;grid-template-columns:1fr 150px 110px;gap:10px;align-items:center;height:44px;padding:0 22px;border-bottom:var(--border-row)"><span style="font:var(--type-table-title);color:var(--text-strong)">Franchise Agreement - Unit 12</span><span style="font:var(--type-table-cell);color:var(--text-muted)">Franchise agreement</span><span style="font:var(--weight-regular) 12.5px var(--font-mono);color:var(--text-secondary);font-variant-numeric:tabular-nums">Mar 10, 2023</span></div>
  <div style="display:grid;grid-template-columns:1fr 150px 110px;gap:10px;align-items:center;height:44px;padding:0 22px;border-bottom:var(--border-row)"><span style="font:var(--type-table-title);color:var(--text-strong)">Amendment No. 1 - Unit 12</span><span style="font:var(--type-table-cell);color:var(--text-muted)">Amendment</span><span style="font:var(--weight-regular) 12.5px var(--font-mono);color:var(--text-secondary);font-variant-numeric:tabular-nums">Jun 20, 2024</span></div>
  <div style="display:grid;grid-template-columns:1fr 150px 110px;gap:10px;align-items:center;height:44px;padding:0 22px;border-bottom:var(--border-row)"><span style="font:var(--type-table-title);color:var(--text-strong)">Lease Rider - Unit 12</span><span style="font:var(--type-table-cell);color:var(--text-muted)">Lease rider</span><span style="font:var(--weight-regular) 12.5px var(--font-mono);color:var(--text-secondary);font-variant-numeric:tabular-nums">Mar 10, 2023</span></div>
</div>
</body>
</html>
