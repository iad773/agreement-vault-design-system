<!-- @dsCard group="Type" viewport="700x210" subtitle="Weight first, size second, color last." name="Hierarchy is weight" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 18px 20px; background: var(--surface-card); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .sw { width: 78px; }
  .chip { height: 46px; border-radius: var(--radius-md); border: 1px solid var(--border-hairline); }
  .nm { font: var(--type-label-caps); color: var(--text-strong); margin-top: 6px; display: block; }
  .hx { font: var(--weight-regular) 10.5px var(--font-mono); color: var(--text-muted); display: block; }
</style>
</head>
<body>
<div style="display:grid;gap:7px">
  <span style="font:var(--type-page-heading);color:var(--text-strong)">Your morning report</span>
  <span style="font:var(--type-card-title);color:var(--text-strong)">Under contract</span>
  <span style="font:var(--type-table-title);color:var(--text-strong)">Franchise Agreement - Unit 12</span>
  <span style="font:var(--type-body);color:var(--text-secondary)">Callahan Development Group, 4 documents</span>
  <span style="font:var(--type-label-caps);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)">3 findings from this morning's check</span>
</div>
</body>
</html>
