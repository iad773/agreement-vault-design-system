<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 18px 20px; background: var(--surface-card); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .sw { width: 78px; }
  .chip { height: 46px; border-radius: var(--radius-md); border: 1px solid var(--border-hairline); }
  .nm { font: var(--type-label-caps); color: var(--text-strong); margin-top: 6px; display: block; }
  .hx { font: var(--weight-regular) 10.5px var(--font-mono); color: var(--text-muted); display: block; }
</style>
</head>
<body>
<div style="display:grid;place-items:start;gap:12px">
  <div style="border-top:3px solid var(--steel-900);border-bottom:3px solid var(--steel-900);padding:10px 8px;font:var(--weight-black) 18px var(--font-slab);letter-spacing:var(--tracking-wordmark);text-transform:uppercase;color:var(--text-strong)">Agreement Vault</div>
  <span style="font:var(--weight-regular) 12.5px var(--font-sans);color:var(--text-muted)">Do not reconstruct or approximate a mark. Type stands in until real art exists.</span>
</div>
</body>
</html>
