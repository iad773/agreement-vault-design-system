<!-- @dsCard group="Type" viewport="700x165" subtitle="Letterspaced caps for labels; platform mono for dates." name="Micro labels and mono" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 18px 20px; background: var(--surface-card); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .sw { width: 78px; }
  .chip { height: 46px; border-radius: var(--radius-md); border: 1px solid var(--border-hairline); }
  .nm { font: var(--type-label-caps); color: var(--text-strong); margin-top: 6px; display: block; }
  .hx { font: var(--weight-regular) 10.5px var(--font-mono); color: var(--text-muted); display: block; }
</style>
</head>
<body>
<div style="font:var(--type-label-caps);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)">Title &nbsp; Type &nbsp; Status &nbsp; Effective &nbsp; Filed</div>
<div style="font:var(--weight-regular) 13px var(--font-mono);color:var(--text-secondary);margin-top:12px">Mar 3, 2023 &nbsp; Jun 18, 2024 &nbsp; Feb 12, 2023</div>
<div style="font:var(--weight-regular) 12.5px var(--font-sans);color:var(--text-muted);margin-top:10px">Dates and counts always carry tabular-nums so columns line up.</div>
</body>
</html>
