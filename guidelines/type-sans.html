<!-- @dsCard group="Type" viewport="700x185" subtitle="All interface text, tables, and microcopy. 12px floor." name="Source Sans 3, interface" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 18px 20px; background: var(--surface-card); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .sw { width: 78px; }
  .chip { height: 46px; border-radius: var(--radius-md); border: 1px solid var(--border-hairline); }
  .nm { font: var(--type-label-caps); color: var(--text-strong); margin-top: 6px; display: block; }
  .hx { font: var(--weight-regular) 10.5px var(--font-mono); color: var(--text-muted); display: block; }
</style>
</head>
<body>
<div style="font:var(--weight-semibold) 24px var(--font-sans);color:var(--text-strong)">Needs your attention <span style="font-weight:400">Aa 0123456789</span></div>
<div style="display:grid;gap:4px;margin-top:10px">
  <span style="font:var(--type-body);color:var(--text-body)">14px body - Unit 6 has no signed franchise agreement on file.</span>
  <span style="font:var(--type-table-cell);color:var(--text-secondary)">13.5px table cell - Personal guarantee</span>
  <span style="font:var(--weight-regular) var(--text-sm) var(--font-sans);color:var(--text-muted)">12.5px meta - Read from executed agreements.</span>
</div>
</body>
</html>
