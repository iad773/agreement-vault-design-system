<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agreement Vault - Strongbox UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--surface-app); }
  .demo-bar {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 20px; background: var(--surface-card);
    border-bottom: var(--border-width-hairline) solid var(--border-card);
    font: var(--weight-regular) var(--text-sm) var(--font-sans); color: var(--text-muted);
  }
  .demo-bar strong { font: var(--weight-bold) var(--text-base) var(--font-sans); color: var(--text-strong); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../ds-preview.js"></script>
<script src="data.js"></script>
<script type="text/babel" data-presets="react" src="icons.jsx"></script>
<script type="text/babel" data-presets="react" src="AppFrame.jsx"></script>
<script type="text/babel" data-presets="react" src="OverviewScreen.jsx"></script>
<script type="text/babel" data-presets="react" src="DocumentsScreen.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
  function App() {
    const [screen, setScreen] = React.useState("overview");
    const [sandbox, setSandbox] = React.useState(false);
    const Screen = screen === "documents" ? window.DocumentsScreen : window.OverviewScreen;
    return (
      <div>
        <div className="demo-bar">
          <strong>Agreement Vault</strong>
          <span>Strongbox UI kit. Click Overview or Documents in the sidebar; right-click a document row for record actions.</span>
          <span style={{ marginLeft: "auto" }}>
            <window.Switch checked={sandbox} onChange={() => setSandbox(!sandbox)} label="Sandbox mode" />
          </span>
        </div>
        <window.AppFrame screen={screen} onNavigate={setScreen} sandbox={sandbox}>
          <Screen />
        </window.AppFrame>
      </div>
    );
  }

  function whenReady(test, run) {
    if (test()) return run();
    setTimeout(function () { whenReady(test, run); }, 30);
  }

  window.__dsReady(["../../components/core/Button.jsx", "../../components/core/IconButton.jsx", "../../components/core/Badge.jsx", "../../components/core/Tag.jsx", "../../components/core/Card.jsx", "../../components/forms/Input.jsx", "../../components/forms/Select.jsx", "../../components/forms/Checkbox.jsx", "../../components/forms/Switch.jsx", "../../components/data/StatusBadge.jsx", "../../components/data/DataTable.jsx", "../../components/data/FindingRow.jsx", "../../components/data/StatBlock.jsx", "../../components/navigation/AppChrome.jsx", "../../components/navigation/SidebarNav.jsx", "../../components/navigation/Breadcrumb.jsx", "../../components/navigation/EntityTree.jsx", "../../components/navigation/SandboxBanner.jsx", "../../components/navigation/ContextMenu.jsx"], function () {
    const NEEDS = ["Card", "Button", "Badge", "IconButton", "Input", "Select", "Checkbox", "Switch", "StatBlock", "FindingRow", "DataTable", "StatusBadge", "AppChrome", "SidebarNav", "Breadcrumb", "EntityTree", "SandboxBanner", "ContextMenu"];
    const ns = window.__ds(NEEDS);
    NEEDS.forEach(function (n) { window[n] = ns[n]; });
    whenReady(
      function () { return window.AppFrame && window.OverviewScreen && window.DocumentsScreen && window.Icon; },
      function () { ReactDOM.createRoot(document.getElementById("root")).render(<App />); }
    );
  });
</script>
</body>
</html>
